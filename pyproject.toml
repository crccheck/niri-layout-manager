[project]
name = "niri-layout-manager"
version = "0.1.0"
description = "Save and load niri window layouts."
requires-python = ">=3.11"
license = "ISC"
license-files = ["LICENSE"]
authors = [{ name = "crccheck" }]
keywords = ["niri", "wayland", "layout", "window-manager"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Window Managers",
]
dependencies = []

[project.scripts]
niri-layout-manager = "niri_layout_manager:main"

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff.lint]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "G",   # flake8-logging-format
  "I",   # isort
  "N",   # pep8-naming
  "RET", # flakes8-return
  "RUF", # Ruff-specific rules
  "UP",  # pyupgrade
  "PLC", # pylint conventions
]

[tool.mypy]
files = ["niri_layout_manager.py"]
ignore_missing_imports = true
warn_unused_ignores = true
